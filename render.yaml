services:
  - type: web
    name: online-lerncampus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: APP_ENV
        value: preview
      - key: APP_DEBUG
        value: "false"
      - key: CONTENT_SEED_ON_STARTUP
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./local.db
      - key: APP_SECRET
        generateValue: true
